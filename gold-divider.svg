<svg width="1200" height="14" viewBox="0 0 1200 14" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFF3B0" stop-opacity="1"/>
      <stop offset="85%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="6" width="1200" height="2" fill="url(#goldFade)" filter="url(#glow)"/>
</svg>
